<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 0 - Responsive Typography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <h1>Responsive Typography</h1>
    <h2>Font sizes change with screen width</h2>
    <p>
        On mobile the text is small, on tablet it is medium, and on desktop it is large.
        Resize the browser window to see the breakpoints in action.
    </p>
    <p class="note">Current mode: <span class="mode"></span></p>
</main>
</body>
</html>
